
name: Kapa VPN Update

on:
  schedule:
    - cron: "1 1 * 1 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kapa-vpn-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Kapa VPN
        run: |
          python kapa_fetch.py \
            -o kapa_out \
            --mail mail.tm \
            --otp-timeout 180

      - name: Update GitHub Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          out = Path("kapa_out")

          files_to_upload = [
              "uris.txt",
              "profiles.json",
              "plans_all.json",
              "countries.json",
          ]

          files = {}

          for name in files_to_upload:
              path = out / name

              if not path.is_file():
                  print(f"[!] Missing file: {name}")
                  sys.exit(1)

              content = path.read_text(encoding="utf-8")

              if name == "uris.txt" and not content.strip():
                  print("[!] URI list is empty. Gist not updated.")
                  sys.exit(1)

              files[name] = {"content": content}
              print(f"[+] Prepared {name}: {len(content)} chars")

          updated = datetime.now(timezone.utc).strftime(
              "%Y-%m-%d %H:%M:%S UTC"
          )
          files["updated.txt"] = {
              "content": updated + "\n"
          }

          token = os.environ["GIST_TOKEN"]
          gist_id = os.environ["GIST_ID"]

          if not token or not gist_id:
              raise RuntimeError("GIST_TOKEN or GIST_ID is missing")

          response = requests.patch(
              f"https://api.github.com/gists/{gist_id}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              json={"files": files},
              timeout=60,
          )

          if not response.ok:
              print(response.text[:2000])
              response.raise_for_status()

          data = response.json()
          print("[+] Gist successfully updated")
          print("[+] URL:", data.get("html_url"))
          print("[+] Updated:", updated)
          PY
